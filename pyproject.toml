[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "da-profiler"
version = "0.1.0"
description = "Da Profiler: Isolated query profiling and mock-data sandbox for Django REST endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Bilal Ahmad", email = "bilal072ahmad@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

# Core deps only — framework-agnostic (analyzer, AST query fingerprinting).
dependencies = [
    "sqlglot>=26.0.0",
]

[project.optional-dependencies]
django = [
    "django>=4.2",
    "djangorestframework>=3.15",
    "model_bakery>=1.23",
    "psycopg2-binary>=2.9",
]

dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["dqs*"]

# Includes HTML dashboard templates in package builds
[tool.setuptools.package-data]
"dqs.adapters.drf" = ["templates/dqs/*.html"]

# Automatically configures pytest for the Django/DRF demo project
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = [".","demos/drf"]
testpaths = ["tests"]

# Disable the default Django test runner (we use pytest-django exclusively)
addopts = "-p no:cacheprovider"

# Register markers by framework so CI can run only the relevant suite.
# Usage:
#   pytest -m core        → pure Python tests only (fastest, no DB)
#   pytest -m django      → Django + DRF adapter tests (requires DB)
#   pytest -m drf         → DRF-specific adapter tests subset
#   pytest -m sqlalchemy  → SQLAlchemy adapter tests (future)
#   pytest                → run everything
[tool.pytest.ini_options.markers]
core = "Pure Python tests — no DB, no framework overhead (dqs/core/)"
django = "Tests requiring Django settings and DB access (dqs/adapters/drf/)"
drf = "Tests for the Django REST Framework adapter specifically"
sqlalchemy = "Tests for a future SQLAlchemy adapter"