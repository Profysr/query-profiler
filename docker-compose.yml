services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - dqs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dqs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python demo_project/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app          # live-reload: local edits reflect instantly
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: demo_project.config.settings
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dqs_pgdata: