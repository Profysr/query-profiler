services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - dqs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dqs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Isolated Django Adapter Demo
  demo-django:
    build:
      context: .
      dockerfile: demos/django/Dockerfile
    command: python demos/django/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app          # live-reload across dqs/ core and adapter files
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: demos.django.demo_project.config.settings
    depends_on:
      db:
        condition: service_healthy

  # Future service placeholder when adding Adapter #2
  # demo-sqlalchemy:
  #   build:
  #     context: .
  #     dockerfile: demos/fastapi_sqlalchemy/Dockerfile
  #   ports:
  #     - "8001:8001"

volumes:
  dqs_pgdata: