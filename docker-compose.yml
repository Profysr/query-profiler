services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - dqs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Isolated Django Adapter Demo
  demo-django:
    build:
      context: .
      dockerfile: demos/drf/Dockerfile
    command: python demos/drf/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app          # Live-reload across dqs/ core and adapter files
    ports:
      - "8000:8000"
    env_file:
      - .env
    working_dir: /app
    # environment:
      # - PYTHONPATH=/app:/app/demos/drf
    #   DJANGO_SETTINGS_MODULE: demos.drf.config.settings
    depends_on:
      db:
        condition: service_healthy

  # Future service placeholder when adding Adapter #2
  # demo-sqlalchemy:
  #   build:
  #     context: .
  #     dockerfile: demos/fastapi_sqlalchemy/Dockerfile
  #   ports:
  #     - "8001:8001"

volumes:
  dqs_pgdata: